
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}  <style>
    .login-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .login-box {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .input-field {
      transition: all 0.3s;
      border: 1px solid #e2e8f0;
    }
    .input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
    }
    html.dark .login-container {
      background: linear-gradient(135deg, #3b4cc4 0%, #4a2b6b 100%);
    }
    html.dark .login-box {
      background-color: rgba(17, 24, 39, 0.95);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    html.dark .login-box .text-gray-800 { color: #f3f4f6; }
    html.dark .login-box .text-gray-600,
    html.dark .login-box .text-gray-700 { color: #cbd5e1; }
  </style>
</head>
<body class="login-container flex items-center justify-center">
  <div class="login-box p-8 rounded-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-calendar-check mr-2"></i>订阅管理系统</h1>
      <p class="text-gray-600 mt-2">登录管理您的订阅提醒</p>
    </div>
    
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-user mr-2"></i>用户名
        </label>
        <input type="text" id="username" name="username" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i>密码
        </label>
        <input type="password" id="password" name="password" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <button type="submit" 
        class="btn-primary w-full py-3 rounded-lg text-white font-medium focus:outline-none">
        <i class="fas fa-sign-in-alt mr-2"></i>登录
      </button>
      
      <div id="errorMsg" class="text-red-500 text-center" role="alert"></div>
      <p class="text-xs text-amber-700 text-center mt-3 leading-relaxed">
        若仍使用默认账号 <code>admin</code> / <code>password</code>，登录后请立即在「系统配置」修改密码。
      </p>
    </form>

    <div id="passkeyDivider" class="flex items-center my-6">
      <div class="flex-grow border-t border-gray-300"></div>
      <span class="mx-3 text-sm text-gray-500">或</span>
      <div class="flex-grow border-t border-gray-300"></div>
    </div>
    <button type="button" id="passkeyLoginBtn"
      class="w-full py-3 rounded-lg font-medium focus:outline-none border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">
      <i class="fas fa-key mr-2"></i>使用通行密钥登录
    </button>
  </div>

  <script>
    function base64URLToBuffer(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function bufferToBase64URL(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const button = e.target.querySelector('button');
      const originalContent = button.innerHTML;
      button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
      button.disabled = true;
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          window.location.href = '/admin';
        } else {
          document.getElementById('errorMsg').textContent = result.message || '用户名或密码错误';
          button.innerHTML = originalContent;
          button.disabled = false;
        }
      } catch (error) {
        document.getElementById('errorMsg').textContent = '发生错误，请稍后再试';
        button.innerHTML = originalContent;
        button.disabled = false;
      }
    });

    // ───────────────────────────────────────────────────────
    // 通行密钥登录
    // ───────────────────────────────────────────────────────
    (function () {
      const btn = document.getElementById('passkeyLoginBtn');
      const divider = document.getElementById('passkeyDivider');
      // 不支持 WebAuthn 的浏览器直接隐藏入口
      if (!window.PublicKeyCredential) {
        btn.style.display = 'none';
        divider.style.display = 'none';
        return;
      }

      btn.addEventListener('click', async () => {
        const originalContent = btn.innerHTML;
        const errorMsg = document.getElementById('errorMsg');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>等待安全密钥...';
        btn.disabled = true;
        errorMsg.textContent = '';

        try {
          const optionsRes = await fetch('/api/passkey/login-options', { method: 'POST' });
          const optionsResult = await optionsRes.json();
          if (!optionsResult.success) {
            errorMsg.textContent = optionsResult.message || '通行密钥登录不可用';
            btn.innerHTML = originalContent;
            btn.disabled = false;
            return;
          }

          const options = optionsResult.options;
          options.challenge = base64URLToBuffer(options.challenge);
          if (options.allowCredentials) {
            options.allowCredentials.forEach((cred) => {
              cred.id = base64URLToBuffer(cred.id);
            });
          }

          const credential = await navigator.credentials.get({ publicKey: options });
          const response = credential.response;
          const payload = {
            id: credential.id,
            rawId: bufferToBase64URL(credential.rawId),
            type: credential.type,
            response: {
              authenticatorData: bufferToBase64URL(response.authenticatorData),
              clientDataJSON: bufferToBase64URL(response.clientDataJSON),
              signature: bufferToBase64URL(response.signature),
              userHandle: response.userHandle ? bufferToBase64URL(response.userHandle) : null
            }
          };

          const verifyRes = await fetch('/api/passkey/login-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const verifyResult = await verifyRes.json();
          if (verifyResult.success) {
            window.location.href = '/admin';
          } else {
            errorMsg.textContent = verifyResult.message || '通行密钥验证失败';
            btn.innerHTML = originalContent;
            btn.disabled = false;
          }
        } catch (error) {
          errorMsg.textContent = '通行密钥登录已取消或失败，请重试或使用密码登录';
          btn.innerHTML = originalContent;
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
